<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Layout Responsivo com Bootstrap</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- CABEÇALHO -->
        <!-- ========================= -->
        <div class="row">

            <div class="col-12 bg-primary text-white p-3">

                <h1>Meu Site</h1>

            </div>

        </div>


        <!-- ========================= -->
        <!-- CONTEÚDO -->
        <!-- ========================= -->
        <div class="row mt-3">

            <!-- MENU -->
            <!--
                Celular: ocupa 12 colunas
                A partir de md: ocupa 3 colunas
            -->
            <div class="col-12 col-md-3 bg-light p-3">

                <h3>Menu</h3>

                <p>Início</p>
                <p>Produtos</p>
                <p>Serviços</p>
                <p>Contato</p>

            </div>


            <!-- CONTEÚDO PRINCIPAL -->
            <!--
                Celular: ocupa 12 colunas
                A partir de md: ocupa 9 colunas
            -->
            <div class="col-12 col-md-9 bg-secondary text-white p-3">

                <h2>Conteúdo Principal</h2>

                <p>
                    Este é o conteúdo principal da página.
                </p>

            </div>

        </div>


        <!-- ========================= -->
        <!-- RODAPÉ -->
        <!-- ========================= -->
        <div class="row mt-3">

            <div class="col-12 bg-dark text-white text-center p-3">

                <p class="mb-0">
                    Rodapé
                </p>

            </div>

        </div>

    </div>


    <!-- JavaScript Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
