<!DOCTYPE html>
<html lang="pt-BR">
<!-- IW 1-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário Bootstrap</title>

    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-5">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Cadastro de Usuário</h3>
                    </div>

                    <div class="card-body">

                        <form action="processarFormulario.php" method="get" enctype="multipart/form-data">

                            <!-- Nome -->
                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome
                                </label>

                                <input type="text" class="form-control" id="nome" name="nome"
                                    placeholder="Digite seu nome" required>
                            </div>

                            <!-- E-mail -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    E-mail
                                </label>

                                <input type="email" class="form-control" id="email" name="email"
                                    placeholder="exemplo@email.com" required>
                            </div>

                            <!-- Senha -->
                            <div class="mb-3">
                                <label for="senha" class="form-label">
                                    Senha
                                </label>

                                <input type="password" class="form-control" id="senha" name="senha"
                                    placeholder="Digite sua senha" required>
                            </div>

                            <!-- Curso -->
                            <div class="mb-3">
                                <label for="curso" class="form-label">
                                    Curso
                                </label>

                                <select class="form-select" id="curso" name="curso">

                                    <option selected>
                                        Selecione um curso
                                    </option>

                                    <option value="ads">
                                        Análise e Desenvolvimento de Sistemas
                                    </option>

                                    <option value="ds">
                                        Desenvolvimento de Software
                                    </option>

                                    <option value="bd">
                                        Banco de Dados
                                    </option>

                                    <option value="redes">
                                        Redes de Computadores
                                    </option>

                                </select>
                            </div>

                            <!-- Sexo -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Sexo
                                </label>

                                <div class="form-check">

                                    <input class="form-check-input" type="radio" name="sexo" id="masculino" value="M">

                                    <label class="form-check-label" for="masculino">
                                        Masculino
                                    </label>

                                </div>

                                <div class="form-check">

                                    <input class="form-check-input" type="radio" name="sexo" id="feminino" value="F">

                                    <label class="form-check-label" for="feminino">
                                        Feminino
                                    </label>

                                </div>

                            </div>

                            <!-- Termos -->
                            <div class="mb-3 form-check">

                                <input type="checkbox" class="form-check-input" id="termos" required>

                                <label class="form-check-label" for="termos">

                                    Aceito os termos de uso

                                </label>

                            </div>

                            <!-- Botões -->
                            <div class="d-flex gap-2">

                                <button type="submit" class="btn btn-primary">
                                    Cadastrar
                                </button>

                                <button type="reset" class="btn btn-secondary">
                                    Limpar
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
